<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; rx: 8; ry: 8; }
      .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .step-hdr { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #1E293B; }
      .role-tag { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #0284C7; }
      .text-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
      .arrow { stroke: #0EA5E9; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .highlight-box { fill: #EFF6FF; stroke: #3B82F6; stroke-width: 2; rx: 8; ry: 8; }
      .atomic-badge { fill: #DC2626; font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #FFFFFF; rx: 3; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0EA5E9" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" class="bg" />

  <!-- Title -->
  <text x="40" y="40" class="text-title">Eco Link Enterprise — Core Business Workflow</text>
  <text x="40" y="60" class="text-sub">End-to-End Waste Marketplace, Escrow Transaction, Logistics &amp; DPP Lifecycle</text>

  <!-- Step 1: Listing Creation -->
  <g transform="translate(40, 90)">
    <rect width="270" height="150" class="box" />
    <text x="20" y="30" class="role-tag">ROLE: FACTORY</text>
    <text x="20" y="55" class="step-hdr">1. Upload &amp; AI Classification</text>
    <text x="20" y="80" class="text-desc">• Upload waste specs &amp; image</text>
    <text x="20" y="100" class="text-desc">• PyTorch AI maps category &amp; EWC</text>
    <text x="20" y="120" class="text-desc">• Status: Published</text>
  </g>

  <path d="M 310 165 L 365 165" class="arrow" />

  <!-- Step 2: Auction Initialization -->
  <g transform="translate(365, 90)">
    <rect width="270" height="150" class="box" />
    <text x="20" y="30" class="role-tag">ROLE: PLATFORM</text>
    <text x="20" y="55" class="step-hdr">2. Auction Initialization</text>
    <text x="20" y="80" class="text-desc">• Auto-creates linked Auction</text>
    <text x="20" y="100" class="text-desc">• Bidding opened for Recyclers</text>
    <text x="20" y="120" class="text-desc">• Status: Open</text>
  </g>

  <path d="M 635 165 L 690 165" class="arrow" />

  <!-- Step 3: Anonymous Bidding -->
  <g transform="translate(690, 90)">
    <rect width="270" height="150" class="box" />
    <text x="20" y="30" class="role-tag">ROLE: RECYCLER</text>
    <text x="20" y="55" class="step-hdr">3. Anonymous Sealed Bidding</text>
    <text x="20" y="80" class="text-desc">• Recycler submits bid amount</text>
    <text x="20" y="100" class="text-desc">• Identity anonymized from Factory</text>
    <text x="20" y="120" class="text-desc">• Status: Pending</text>
  </g>

  <path d="M 825 240 L 825 295" class="arrow" />

  <!-- Step 4: Atomic Bid Acceptance -->
  <g transform="translate(40, 295)">
    <rect width="920" height="170" class="highlight-box" />
    <rect x="20" y="15" width="130" height="22" class="atomic-badge" />
    <text x="85" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11px" font-weight="700" fill="#FFFFFF">ATOMIC TRANSACTION</text>
    <text x="170" y="32" class="step-hdr" style="font-size: 14px; fill: #1E3A8A;">4. Bid Acceptance &amp; State Instantiation (/api/marketplace/bids/{id}/accept/)</text>

    <g transform="translate(20, 50)">
      <rect width="270" height="100" class="box" />
      <text x="15" y="30" class="step-hdr">Marketplace &amp; Bids</text>
      <text x="15" y="55" class="text-desc">• Target Bid → Accepted</text>
      <text x="15" y="75" class="text-desc">• Competing Bids → Rejected</text>
    </g>

    <g transform="translate(325, 50)">
      <rect width="270" height="100" class="box" />
      <text x="15" y="30" class="step-hdr">Escrow Transaction</text>
      <text x="15" y="55" class="text-desc">• Transaction Created (5% fee)</text>
      <text x="15" y="75" class="text-desc">• Status: Escrow Held</text>
    </g>

    <g transform="translate(630, 50)">
      <rect width="270" height="100" class="box" />
      <text x="15" y="30" class="step-hdr">Logistics &amp; DPP</text>
      <text x="15" y="55" class="text-desc">• Shipment Created (Pending)</text>
      <text x="15" y="75" class="text-desc">• DPP Instantiated (DPP-XXX)</text>
    </g>
  </g>

  <path d="M 500 465 L 500 520" class="arrow" />

  <!-- Step 5: Logistics Manifest Execution -->
  <g transform="translate(40, 520)">
    <rect width="440" height="150" class="box" />
    <text x="20" y="30" class="role-tag">ROLE: LOGISTICS FLEET</text>
    <text x="20" y="55" class="step-hdr">5. Manifest Execution &amp; Waybill Tracking</text>
    <text x="20" y="80" class="text-desc">• Assign Driver &amp; Vehicle → Assigned</text>
    <text x="20" y="100" class="text-desc">• Pick up waste → Picked Up → In Transit</text>
    <text x="20" y="120" class="text-desc">• Deliver to facility → Status: Delivered</text>
  </g>

  <path d="M 480 595 L 520 595" class="arrow" />

  <!-- Step 6: Recycler Receipt & Escrow Release -->
  <g transform="translate(520, 520)">
    <rect width="440" height="150" class="box" />
    <text x="20" y="30" class="role-tag">ROLE: RECYCLER</text>
    <text x="20" y="55" class="step-hdr">6. Delivery Sign-off &amp; Escrow Settlement</text>
    <text x="20" y="80" class="text-desc">• Confirm physical receipt (/api/shipments/{id}/confirm/)</text>
    <text x="20" y="100" class="text-desc">• Shipment status transitions to Confirmed</text>
    <text x="20" y="120" class="text-desc">• Transaction completed, Escrow released to Factory</text>
  </g>

</svg>
