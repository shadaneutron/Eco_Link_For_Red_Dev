services:
  # Backend Django API Web Service
  - type: web
    name: ecolink-backend
    env: python
    region: singapore
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ecolink-db
          property: connectionString
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

  # Frontend React Static Site
  - type: static
    name: ecolink-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ecolink-backend
          property: host
          suffix: "/api"

databases:
  # Free PostgreSQL Database
  - name: ecolink-db
    databaseName: ecolink
    user: ecolink_user
