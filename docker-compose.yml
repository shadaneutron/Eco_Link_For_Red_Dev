name: ecolink

services:
  # PostgreSQL Database Container
  db:
    image: postgres:15-alpine
    container_name: ecolink_db
    restart: always
    environment:
      POSTGRES_DB: ecolink_db
      POSTGRES_USER: ecolink_user
      POSTGRES_PASSWORD: ecolink_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecolink_user -d ecolink_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Django Backend Web Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecolink_backend
    restart: always
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-docker-secret-key-ecolink-prod
      - DATABASE_URL=postgres://ecolink_user:ecolink_password@db:5432/ecolink_db
      - ALLOWED_HOSTS=*
      - CORS_ALLOW_ALL_ORIGINS=True
      - CSRF_TRUSTED_ORIGINS=http://localhost,http://127.0.0.1
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # React + Nginx Frontend Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecolink_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_volume:
  static_volume:
